<!-- @dsCard group="Colors" viewport="700x130" name="Akcja i obrysy" subtitle="Jeden kolor akcji na ekran; trzy stopnie obrysu" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div class="row">
<div class="sw"><i style="background:var(--en-action)"></i><b>akcja</b><s>--en-action · ZATWIERDŹ TURĘ</s></div><div class="sw"><i style="background:var(--en-border)"></i><b>obrys</b><s>--en-border</s></div><div class="sw"><i style="background:var(--en-border-subtle)"></i><b>obrys słaby</b><s>--en-border-subtle</s></div><div class="sw"><i style="background:var(--en-border-strong)"></i><b>obrys mocny</b><s>--en-border-strong</s></div>
<div class="sw" style="min-width:180px"><i style="background:var(--en-action);color:var(--en-action-fg);display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:1px;font-size:11px">ZATWIERDŹ TURĘ ▸</i><s>--en-action / --en-action-fg</s></div>
</div>
</body></html>
