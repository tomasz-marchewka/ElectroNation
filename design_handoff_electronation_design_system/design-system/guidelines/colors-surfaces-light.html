<!-- @dsCard group="Colors" viewport="700x130" name="Powierzchnie — motyw jasny" subtitle="Ten sam układ na chłodnej jasnej palecie; mapa ciemniejsza od panelu" -->
<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div class="row">
<div class="sw"><i style="background:var(--en-bg-map)"></i><b>mapa</b><s>--en-bg-map</s></div><div class="sw"><i style="background:var(--en-bg-app)"></i><b>aplikacja</b><s>--en-bg-app</s></div><div class="sw"><i style="background:var(--en-bg-header)"></i><b>pasek górny</b><s>--en-bg-header</s></div><div class="sw"><i style="background:var(--en-bg-panel)"></i><b>panel</b><s>--en-bg-panel</s></div><div class="sw"><i style="background:var(--en-bg-panel-sunk)"></i><b>panel — dół</b><s>--en-bg-panel-sunk</s></div><div class="sw"><i style="background:var(--en-bg-chart)"></i><b>wykres</b><s>--en-bg-chart</s></div><div class="sw"><i style="background:var(--en-bg-track)"></i><b>tor</b><s>--en-bg-track</s></div>
</div>
</body></html>
