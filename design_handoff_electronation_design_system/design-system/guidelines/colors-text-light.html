<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:6px;font-size:var(--en-fs-base)">
<span style="color:var(--en-text)">1500 MW — wartość, na której gracz podejmuje decyzję · --en-text</span>
<span style="color:var(--en-text-2)">POPYT — opis wielkości · --en-text-2</span>
<span style="color:var(--en-text-3)">BILANS PRZY OBECNYCH NASTAWACH — etykieta sekcji · --en-text-3</span>
<span style="color:var(--en-text-4)">0 / 120 — jednostka wyłączona, zapas · --en-text-4</span>
</div>
</body></html>
