<!-- @dsCard group="Spacing" viewport="700x140" name="Krawędzie: zero promieni" subtitle="Podział 1-px kreską, akcent 2-px górną krawędzią" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div class="row" style="align-items:stretch">
<div style="width:150px;height:60px;border:1px solid var(--en-border);background:var(--en-bg-panel);display:flex;align-items:center;justify-content:center;color:var(--en-text-3)">border 1px</div>
<div style="width:150px;height:60px;border-top:2px solid var(--en-action);background:var(--en-bg-report);display:flex;align-items:center;justify-content:center;color:var(--en-text-3)">akcent 2px</div>
<div style="width:150px;height:60px;background:var(--en-bg-panel-sunk);display:flex;align-items:center;justify-content:center;color:var(--en-text-3)">zagłębienie</div>
<div style="align-self:center;color:var(--en-text-4);max-width:180px">--en-radius: 0. Żaden element UI nie ma promienia ani cienia. Wyjątek: kropka stanu.</div>
</div>
</body></html>
