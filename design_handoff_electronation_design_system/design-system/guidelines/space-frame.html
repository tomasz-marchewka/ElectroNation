<!-- @dsCard group="Spacing" viewport="700x150" name="Wymiary ramy" subtitle="Stałe wymiary ekranu dyspozytora" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:6px;color:var(--en-text-2);font-size:11px">
<span><b style="color:var(--en-text);font-weight:400">--en-header-h 52 px</b> — pasek górny</span>
<span><b style="color:var(--en-text);font-weight:400">--en-panel-w 400 px</b> — panel dyspozytora przy prawej krawędzi</span>
<span><b style="color:var(--en-text);font-weight:400">--en-track-h 8 px / --en-track-h-sm 6 px</b> — tor pasma prognozy / tor nastawy</span>
<span><b style="color:var(--en-text);font-weight:400">--en-thumb-w 3 × --en-thumb-h 12 px</b> — uchwyt nastawy jako kreska</span>
<span><b style="color:var(--en-text);font-weight:400">--en-hex-r 34 px</b> — heks flat-top, 1 heks = 25 km</span>
</div>
</body></html>
