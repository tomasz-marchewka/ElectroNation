<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:4px;min-width:96px}
.sw i{display:block;height:34px;border:1px solid var(--en-border)}
.sw b{color:var(--en-text);font-weight:400;font-size:var(--en-fs-caption)}
.sw s{text-decoration:none;color:var(--en-text-4);font-size:var(--en-fs-micro)}
.hexsw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px}
</style>
</head>
<body>
<div class="row" style="align-items:flex-end">
<div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-1);border:0"></i><s>--en-space-1</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-2);border:0"></i><s>--en-space-2</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-3);border:0"></i><s>--en-space-3</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-4);border:0"></i><s>--en-space-4</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-5);border:0"></i><s>--en-space-5</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-6);border:0"></i><s>--en-space-6</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-7);border:0"></i><s>--en-space-7</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-8);border:0"></i><s>--en-space-8</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-9);border:0"></i><s>--en-space-9</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-10);border:0"></i><s>--en-space-10</s></div><div class="sw" style="min-width:52px"><i style="background:var(--en-border-strong);height:var(--en-space-11);border:0"></i><s>--en-space-11</s></div>
</div>
</body></html>
