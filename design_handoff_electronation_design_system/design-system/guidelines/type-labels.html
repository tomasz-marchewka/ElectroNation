<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">

body{padding:14px 16px;font-family:var(--en-font-mono);font-size:var(--en-fs-caption);color:var(--en-text-3)}

</head>

<div style="display:flex;flex-direction:column;gap:9px">
<span style="font-size:10px;letter-spacing:1.5px;color:var(--en-text-3)">PROGNOZA · TURA 7 &nbsp;&nbsp;<s style="letter-spacing:0;color:var(--en-text-4);font-size:9px">--en-fs-label / --en-ls-label</s></span>
<span style="font-size:12px;letter-spacing:2px;font-weight:600;color:var(--en-text)">⬡ ELECTRONATION &nbsp;&nbsp;<s style="letter-spacing:0;color:var(--en-text-4);font-size:9px">--en-ls-wordmark</s></span>
<span style="font-size:13px;letter-spacing:1px;font-weight:600;color:var(--en-action)">ZATWIERDŹ TURĘ ▸ &nbsp;&nbsp;<s style="letter-spacing:0;color:var(--en-text-4);font-size:9px">--en-ls-action</s></span>
